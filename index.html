<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVANI SHOP - Mua Bán Shop Free Fire</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080c15;
            color: white;
        }


        /* =========================
           RGB ANIMATION
        ========================= */

        @keyframes rgbLogo {

            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 400% 50%;
            }

        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #111827;
            border-bottom: 1px solid #263044;

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        .navbar {
            max-width: 1200px;

            height: 65px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;
        }


        /* LOGO NHỎ HƠN */

        .logo {

            font-size: 21px;

            font-weight: 800;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                violet,
                magenta,
                red
            );

            background-size: 400% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 5s linear infinite;
        }


        /* NAV DESKTOP */

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }


        nav a {

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition: .2s;
        }


        nav a:hover {
            color: #00ffff;
        }


        /* NÚT ĐĂNG NHẬP RGB */

        .login-btn {

            border: none;

            cursor: pointer;

            color: white !important;

            font-weight: bold;

            padding: 10px 17px;

            border-radius: 8px;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 400% 100%;

            animation: rgbLogo 3s linear infinite;

            box-shadow:
                0 0 10px rgba(0,255,255,.3);
        }


        /* =========================
           HAMBURGER
        ========================= */

        .menu-btn {

            width: 44px;
            height: 44px;

            border-radius: 9px;

            border: 1px solid #34405a;

            background: #151c2b;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 5px;

            transition: .2s;
        }


        .menu-btn:hover {
            border-color: #00ffff;
            box-shadow: 0 0 12px rgba(0,255,255,.25);
        }


        .menu-btn span {

            width: 23px;
            height: 3px;

            background: white;

            border-radius: 5px;
        }


        /* =========================
           SIDE MENU
        ========================= */

        .side-menu {

            position: fixed;

            top: 0;
            right: -330px;

            width: 310px;

            height: 100vh;

            background: #101724;

            border-left: 1px solid #303b55;

            z-index: 3000;

            padding: 25px;

            transition: .35s;

            box-shadow:
                -10px 0 30px rgba(0,0,0,.5);
        }


        .side-menu.active {
            right: 0;
        }


        .menu-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .menu-title {

            font-size: 21px;

            font-weight: bold;

            background: linear-gradient(
                90deg,
                red,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 400% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 4s linear infinite;
        }


        .close-menu {

            border: none;

            background: none;

            color: white;

            font-size: 30px;

            cursor: pointer;
        }


        .menu-item {

            width: 100%;

            padding: 15px;

            margin-bottom: 10px;

            border-radius: 9px;

            border: 1px solid #293348;

            background: #151c2b;

            color: white;

            text-decoration: none;

            font-weight: bold;

            display: block;

            cursor: pointer;

            transition: .2s;
        }


        .menu-item:hover {

            background: #202a3e;

            border-color: #00ffff;

            transform: translateX(-3px);
        }


        /* ĐĂNG NHẬP TRONG MENU */

        .menu-login {

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 400% 100%;

            animation: rgbLogo 3s linear infinite;

            border: none;

            color: white;
        }


        /* ĐĂNG XUẤT */

        .logout-item {
            color: #ff5555;
        }


        /* LỚP NỀN */

        .menu-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.65);

            z-index: 2500;
        }


        .menu-overlay.active {
            display: block;
        }


        /* =========================
           HERO
        ========================= */

        .hero {

            min-height: 360px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 50px 20px;

            background:
                linear-gradient(
                    rgba(5,8,15,.75),
                    rgba(5,8,15,.95)
                ),

                radial-gradient(
                    circle at center,
                    #263d69,
                    #080b12
                );
        }


        .hero h1 {

            font-size: 48px;

            margin-bottom: 15px;
        }


        .hero h1 span {

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                violet,
                magenta,
                red
            );

            background-size: 400% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 4s linear infinite;

            filter:
                drop-shadow(0 0 8px rgba(0,255,255,.4))
                drop-shadow(0 0 15px rgba(255,0,255,.3));
        }


        .hero p {

            color: #bfc5d1;

            font-size: 17px;

            margin-bottom: 25px;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-box {

            width: min(650px, 100%);

            margin: auto;

            display: flex;
        }


        .search-box input {

            flex: 1;

            padding: 15px;

            border: none;

            outline: none;

            border-radius: 8px 0 0 8px;

            font-size: 15px;
        }


        .search-box button {

            border: none;

            background: linear-gradient(
                90deg,
                #ff0000,
                #00ffff,
                #ff00ff,
                #ff0000
            );

            background-size: 300% 100%;

            animation: rgbLogo 3s linear infinite;

            color: white;

            padding: 0 25px;

            border-radius: 0 8px 8px 0;

            font-weight: bold;

            cursor: pointer;
        }


        /* =========================
           CONTENT
        ========================= */

        .container {

            max-width: 1200px;

            margin: 40px auto;

            padding: 0 20px;
        }


        .section-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .section-title h2 {

            font-size: 25px;
        }


        .section-title span {

            background: linear-gradient(
                90deg,
                red,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 300% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 4s linear infinite;
        }


        /* =========================
           FILTER
        ========================= */

        .filters {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 25px;
        }


        .filters button {

            background: #151c2b;

            color: white;

            font-weight: bold;

            border: 1px solid #293348;

            padding: 10px 16px;

            border-radius: 7px;

            cursor: pointer;
        }


        .filters button:hover,
        .filters button.active {

            background: linear-gradient(
                90deg,
                red,
                #00ffff,
                #ff00ff
            );

            color: white;

            border: none;
        }


        /* =========================
           EMPTY SHOP
        ========================= */

        .empty-shop {

            min-height: 250px;

            background: #131a29;

            border: 1px solid #222c40;

            border-radius: 12px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        .empty-icon {

            font-size: 55px;

            margin-bottom: 15px;

            filter:
                drop-shadow(0 0 10px cyan)
                drop-shadow(0 0 15px magenta);
        }


        .empty-shop h3 {

            font-size: 22px;

            margin-bottom: 10px;
        }


        .empty-shop p {

            color: #8f99aa;
        }


        /* =========================
           STATS
        ========================= */

        .stats {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin-top: 50px;
        }


        .stat {

            background: #131a29;

            border: 1px solid #222c40;

            padding: 25px;

            border-radius: 10px;

            text-align: center;
        }


        .stat strong {

            display: block;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                violet,
                red
            );

            background-size: 400% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 4s linear infinite;

            font-size: 30px;

            margin-bottom: 5px;
        }


        .stat p {

            color: #9ca5b5;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            margin-top: 60px;

            background: #080c14;

            border-top: 1px solid #20293a;

            padding: 30px 20px;

            text-align: center;

            color: #7f899a;
        }


        footer strong {

            background: linear-gradient(
                90deg,
                red,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 300% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 4s linear infinite;
        }


        /* =========================
           LOGIN / REGISTER MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.78);

            align-items: center;

            justify-content: center;

            z-index: 5000;

            padding: 20px;
        }


        .modal-box {

            width: 400px;

            max-width: 100%;

            background: #111827;

            border: 1px solid #303b55;

            border-radius: 15px;

            padding: 30px;

            text-align: center;

            position: relative;

            box-shadow:
                0 0 30px rgba(0,255,255,.12);
        }


        .modal-box h2 {

            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                red,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 400% 100%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbLogo 4s linear infinite;
        }


        .modal-box p {

            color: #9ca5b5;

            margin-bottom: 20px;
        }


        .modal-box input {

            width: 100%;

            padding: 14px;

            margin-bottom: 13px;

            border: 1px solid #293348;

            background: #080c15;

            color: white;

            border-radius: 8px;

            outline: none;

            font-size: 15px;
        }


        .modal-box input:focus {

            border-color: #00ffff;

            box-shadow:
                0 0 8px rgba(0,255,255,.25);
        }


        .submit-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            font-size: 16px;

            font-weight: bold;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );

            background-size: 400% 100%;

            animation: rgbLogo 3s linear infinite;
        }


        .close-modal {

            position: absolute;

            right: 15px;

            top: 8px;

            border: none;

            background: none;

            color: white;

            font-size: 28px;

            cursor: pointer;
        }


        .form-links {

            margin-top: 18px;

            display: flex;

            justify-content: center;
        }


        .form-links a {

            color: white;

            font-weight: bold;

            font-size: 14px;

            text-decoration: none;
        }


        .form-links a:hover {
            color: #00ffff;
        }


        .message {

            margin-top: 15px;

            font-weight: bold;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            nav {
                display: none;
            }

            .hero h1 {
                font-size: 36px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 550px) {

            .navbar {
                height: 60px;

                padding: 0 15px;
            }


            .logo {
                font-size: 18px;
            }


            .hero h1 {
                font-size: 30px;
            }


            .search-box {

                flex-direction: column;

                gap: 10px;
            }


            .search-box input {

                border-radius: 8px;
            }


            .search-box button {

                border-radius: 8px;

                padding: 13px;
            }


            .side-menu {

                width: 290px;

                right: -300px;
            }

        }

    </style>
</head>
