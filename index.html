<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website của tôi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 30px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<header>
    <h1>Xin chào 👋</h1>
    <p>Đây là website đầu tiên của tôi</p>
</header>

<main>
    <div class="card">
        <h2>Về tôi</h2>
        <p>
            Đây là phần giới thiệu về bản thân hoặc dự án của tôi.
        </p>

        <button onclick="alert('Xin chào!')">
            Bấm vào đây
        </button>
    </div>
</main>

</body>
</html>
